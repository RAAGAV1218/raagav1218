<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">V M Raagav — bold charcoal glass banner</title>
  <desc id="desc">A clean charcoal glass banner with strong, readable ivory typography and restrained champagne accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10100F"/><stop offset="1" stop-color="#1B1916"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".09"/><stop offset=".52" stop-color="#FFFFFF" stop-opacity=".035"/><stop offset="1" stop-color="#D8C39A" stop-opacity=".07"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7E8C6" stop-opacity=".72"/><stop offset=".5" stop-color="#D8C39A" stop-opacity=".22"/><stop offset="1" stop-color="#F0D69C" stop-opacity=".64"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F0D69C"/><stop offset="1" stop-color="#C8A968"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="430" rx="28" fill="url(#background)"/>
  <rect x="54" y="34" width="1332" height="362" rx="34" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="96" y="119" width="4" height="211" rx="2" fill="url(#accent)"/>
  <text x="128" y="143" fill="#E8DCC4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="650" letter-spacing="3">CSE  ·  RAJALAKSHMI ENGINEERING COLLEGE</text>
  <text x="124" y="239" fill="#FFFDF8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="82" font-weight="800" letter-spacing="2.4">V M RAAGAV</text>
  <text x="128" y="287" fill="#F1EDE5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="550" letter-spacing=".2">Computer Science &amp; Engineering  ·  Developer</text>
  <text x="128" y="331" fill="#D8D1C5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="450" letter-spacing=".35">Building useful software across accessibility, AI &amp; IoT</text>
</svg>
